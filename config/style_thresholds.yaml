# TASK_SPEC_013 — пороги классификатора стиля управления эпизодом.
#
# Это плейсхолдер. Конкретные значения должен подобрать эпизод-аналитик
# на реальных данных (ЧР-2025, ~30 финалистов). Файл должен оставаться
# узким и понятным: 3 стиля × несколько порогов, ничего сверх.
#
# Семантика стилей (по DOMAIN_SPEC.md и экспертной встрече 02.05.2026):
#   - endurance   — выносливый стиль: длинные поединки, ровная активность.
#   - speed_power — взрывной/скоростно-силовой стиль: короткие поединки,
#                   высокая плотность действий.
#   - burnout     — «провал по дистанции»: высокая активность в начале и
#                   просадка ко второй половине.
#
# Если ни одно правило не сработало, classify_style возвращает
# `unclassified` + warning `style.no_rule_matched` (не падение).

version: 1
thresholds:
  endurance:
    # Длинные серии и ровно распределённая активность.
    min_episode_count: 8
    min_activity_evenness: 0.6
  speed_power:
    # Короткие серии с высокой плотностью действий.
    max_episode_count: 6
    min_action_density: 1.5
  burnout:
    # Активный старт + просадка во второй половине.
    min_action_density_first_half: 1.5
    max_action_density_second_half: 0.5
