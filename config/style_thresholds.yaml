# TASK_SPEC_013 — пороги классификатора стиля управления эпизодом.
#
# Калиброваны по распределению метрик на 94 спортсменах ЧР-2025
# (docs/Оценка СД содержание.xlsx, лист «Общее») — см. секцию «sanity-check
# распределений» в docs/agent_context/REPOSITORY_NOTES.md.
#
# Семантика стилей (по DOMAIN_SPEC.md и экспертной встрече 02.05.2026):
#   - endurance   — длинные поединки + ровная активность по эпизодам.
#   - speed_power — короткие поединки с высокой долей technical_action.
#   - burnout     — сильный старт + просадка ко второй половине.
#
# Если ни одно правило не сработало, classify_style возвращает
# `unclassified` + warning `style.no_rule_matched` (не падение).
#
# Эталонные квартили на n=94:
#   episode_count        : p25=9   med=10   p75=12   p90=15
#   action_density       : p25=2.5 med=2.67 p75=3.0  p90=3.22
#   activity_evenness    : p25=0.97 med=0.98 p75=0.99 p90=0.99
#   non_technical_share  : p10=0.61 p25=0.82 med=0.92 p75=1.00
#   action_density_h1    : p25=2.5 med=2.8  p75=3.0  p90=3.56
#   action_density_h2    : p25=2.4 med=2.67 p75=3.0  p90=3.2

version: 1
thresholds:
  endurance:
    # Длинная дистанция + ровная активность по всем эпизодам.
    min_episode_count: 12         # ≥ p75 длительности матча
    min_action_density: 2.8       # ≥ медианы плотности действий
    min_activity_evenness: 0.98   # ≥ медианы равномерности

  speed_power:
    # Быстрая решающая работа: короткие матчи + высокая доля technical_action.
    max_episode_count: 6          # ≤ p10 длительности матча
    max_non_technical_share: 0.5  # ≥ половины эпизодов в technical_action

  burnout:
    # Активный старт + просадка во второй половине bout'а.
    min_episode_count: 10         # нужна разумная длина для деления пополам
    min_action_density_first_half: 3.0   # старт ≥ p75
    max_action_density_second_half: 2.4  # концовка ≤ p25
