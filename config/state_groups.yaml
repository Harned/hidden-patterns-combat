# State groups for the 5-state observable Markov chain (TASK_SPEC_011).
#
# Map: episode-state -> list of flatten column names. An episode is "active in
# this group" when at least one listed column has a positive value (1 or 2).
#
# Rules (see docs/agent_context/DOMAIN_SPEC.md "Уровни моделирования"):
#   - 'pause' must NOT list columns (it is the negation of all others);
#   - state names below are fixed (English idents); Russian column names
#     are produced by `hpc_algo.mapping.flatten_columns` over the 3-level
#     header of docs/Оценка СД содержание.xlsx (header_rows = [1, 2, 3]);
#   - in `single` mode, an episode is assigned exactly one state from this
#     priority order:  technical_action > off_balance > grip > manoeuvring > pause.
#
# Source layout (counts):
#   manoeuvring:      24 columns  (ПС × 12 + ЛС × 12 направлений)
#   grip (КФВ):       29 columns  (Захваты 15 + Хваты 3 + Обхваты 3 + Прихваты 4 + Упоры 4)
#   off_balance (ВУП): 5 columns  (Р / Т / С / О / З)
#   technical_action:  6 columns  (Броски Руками/Ногами/Туловищем + Удержание + Болевой На руку/На ногу)
#   pause:             0 columns  (residual)

version: "1"
sheet: "Общее"
mode: single
priority:
  - technical_action
  - off_balance
  - grip
  - manoeuvring
  - pause

states:
  manoeuvring:
    columns:
      # Правосторонняя стойка (ПС): 12 направлений
