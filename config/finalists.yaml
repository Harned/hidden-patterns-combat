# TASK_SPEC_012 — список призёров 1–3 каждой весовой категории.
#
# Это исходные данные для агрегатных моделей. Их получают от эксперта
# (или из официального протокола ЧР-2025), а не вычисляют. Алгоритм
# не пытается восстановить призёров из активности — он только
# использует тот список, который указан здесь.
#
# Формат:
#   weight_classes:
#     "<wc>":
#       1: "<ФИО>"
#       2: "<ФИО>"
#       3: "<ФИО>"
#
# Места > 3 (например, прочие финалисты) можно указывать; в агрегат они
# НЕ попадают (см. AGENT_RULES § Запрещено), но в ранжировании могут
# отображаться как «контекст».

version: 1
weight_classes:
  # Образец — заменить на реальный состав ЧР-2025 (10 категорий).
  # "48":
  #   1: "Иванов И. И."
  #   2: "Петров П. П."
  #   3: "Сидоров С. С."
  # "52":
  #   1: "..."
  #   2: "..."
  #   3: "..."
  {}
