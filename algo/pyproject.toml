[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpc-algo"
version = "0.1.0"
description = "Independent processing module for hidden-patterns-combat: honest Excel audit and baseline analysis of combat-sports competition data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "hidden-patterns-combat" }]

dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "openpyxl>=3.1,<4.0",
    "pydantic>=2.6,<3.0",
    "typer>=0.12,<1.0",
    "hmmlearn>=0.3,<0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<1.0",
]

[project.scripts]
hpc-algo = "hpc_algo.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["hpc_algo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"hpc_algo/cli.py" = ["B008"]  # typer.Argument/Option в defaults — стандартный паттерн Typer
"hpc_algo/schema.py" = ["UP042"]  # StrEnum для pydantic — использую str+Enum для совместимости
